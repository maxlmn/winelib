<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>" />
		<!-- Installable on a phone or a computer (Add to Home Screen, Install app): service-worker.ts -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="WineLib" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="theme-color" content="#f6f1ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1f1c22" media="(prefers-color-scheme: dark)" />
		<title>WineLib</title>
		<script>
			// Apply the saved appearance before first paint (same rules as src/lib/theme.svelte.ts)
			try {
				var t = JSON.parse(localStorage.getItem('winelib-theme') || '{}');
				var r = document.documentElement;
				var dark = t.mode === 'dark' || (t.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				r.dataset.theme = dark ? 'dark' : 'light';
				r.dataset.font = t.font || 'sans';
				if (t.palette) r.dataset.palette = t.palette;
				if (t.light) r.style.setProperty('--accent-light', t.light);
				if (t.dark) r.style.setProperty('--accent-dark', t.dark);
				if (t.link) r.style.setProperty('--link-mix', t.link);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
