<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>" />
		<!-- Installable on a phone or a computer (Add to Home Screen, Install app): service-worker.ts -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="WineLib" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="theme-color" content="#f6f1ee" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1f1c22" media="(prefers-color-scheme: dark)" />
		<title>WineLib</title>
		<script>
			// Apply the saved appearance before first paint (same rules as src/lib/theme.svelte.ts)
			try {
				var t = JSON.parse(localStorage.getItem('winelib-theme') || '{}');
				var r = document.documentElement;
				var dark = t.mode === 'dark' || (t.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				r.dataset.theme = dark ? 'dark' : 'light';
				r.dataset.font = t.font || 'serif';
				r.dataset.palette = t.palette || 'bordeaux';
				if (t.light) r.style.setProperty('--accent-light', t.light);
				if (t.dark) r.style.setProperty('--accent-dark', t.dark);
				if (t.link) r.style.setProperty('--link-mix', t.link);
				var hex = dark ? t.dark : t.light;
				if (hex) {
					var l = [1, 3, 5].map(function (i) {
						var c = parseInt(hex.slice(i, i + 2), 16) / 255;
						return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
					});
					l = 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2];
					r.style.setProperty('--on-accent', 1.05 / (l + 0.05) >= (l + 0.05) / 0.06 ? '#fff' : '#1a171c');
				}
			} catch (e) {}
		</script>
		<style>
			/* The first screen, until the app has its data (removed by +layout.svelte): shown after a moment, so a
			   quick start doesn't flash it */
			#boot {
				position: fixed;
				inset: 0;
				display: grid;
				place-content: center;
				gap: 6px;
				text-align: center;
				font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				color: #776f69;
				opacity: 0;
				animation: boot-in 0.3s 0.4s forwards;
			}
			#boot b {
				font-size: 20px;
				color: #2a2522;
			}
			:root[data-theme='dark'] #boot {
				color: #9d96a3;
			}
			:root[data-theme='dark'] #boot b {
				color: #ece8ef;
			}
			@keyframes boot-in {
				to {
					opacity: 1;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" aria-live="polite"><b>🍷 WineLib</b><span>Loading…</span></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
