# The website (site/: the home page and the manual) built and published to GitHub Pages when it, the guides, the
# MCP page or the screenshots change on main. Repository settings › Pages › Source: GitHub Actions.
# A custom domain: set the repository variables SITE_URL (https://example.org) and BASE_PATH (/).
name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "app/api/data/docs/**"
      - "app/mcp_server/README.md"
      - "screenshots/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
