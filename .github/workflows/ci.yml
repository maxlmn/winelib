# Tests and checks on every push to main and every pull request: the API, the web app, the browser smoke tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/api/requirements*.txt
            app/mcp_server/requirements.txt
      # the MCP server's SDK too: its tests run with the API's (tests/test_mcp_server.py)
      - run: pip install -r app/api/requirements.txt -r app/api/requirements-dev.txt -r app/mcp_server/requirements.txt
      - name: Tests
        working-directory: app/api
        run: python -m pytest -q tests

  # The schema on Postgres, as installations run it (the api job's tests use SQLite): migrations up and down, the
  # reference data (tests/test_postgres.py)
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: winelib_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d winelib_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/api/requirements*.txt
      - run: pip install -r app/api/requirements.txt -r app/api/requirements-dev.txt
      - name: Postgres schema
        working-directory: app/api
        env:
          TEST_PG_URL: postgresql://test:test@localhost:5432/winelib_test
        run: python -m pytest -q tests/test_postgres.py

  # What a release needs: the app and its own modules import with app/api/requirements.txt alone (no plug-in or test
  # packages), as after "pip install -r app/api/requirements.txt" from the release zip
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r app/api/requirements.txt
      - run: python scripts/check_imports.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The browser smoke tests (app/web/e2e): the app as it runs, on a new installation, clicked through in Chromium
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/api/requirements.txt
      - run: pip install -r ../api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/web/playwright-report

  # The Dockerfile builds (not pushed: the release publishes the image)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
