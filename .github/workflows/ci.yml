# Tests and checks on every push to main and every pull request: the API, the web app.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/api/requirements*.txt
      - run: pip install -r app/api/requirements.txt -r app/api/requirements-dev.txt
      - name: Tests
        working-directory: app/api
        run: python -m pytest -q tests

  # What a release needs: the app and its own modules import with app/api/requirements.txt alone (no plug-in or test
  # packages), as after "pip install -r app/api/requirements.txt" from the release zip
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r app/api/requirements.txt
      - run: python scripts/check_imports.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
