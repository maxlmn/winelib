# A release: push a tag (git tag v0.1.0 && git push origin v0.1.0). The tests run, the web app is built, a zip (the
# code with the built web app, so no Node.js is needed to run it) is attached to the tag's GitHub release, and the
# Docker image is published as ghcr.io/maxlmn/winelib:<version> and :latest (amd64 and arm64).
# To run the zip: unzip, pip install -r app/api/requirements.txt, python run.py. The image: docker-compose.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Tests
        run: |
          pip install -r app/api/requirements.txt -r app/api/requirements-dev.txt
          cd app/api && python -m pytest -q tests
      - name: Build the web app
        working-directory: app/web
        run: npm ci && npm run build
      - name: Zip
        run: |
          name="winelib-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="$name/" HEAD | tar -x
          cp -r app/web/build "$name/app/web/build"
          zip -qr "$name.zip" "$name"
          echo "ZIP=$name.zip" >> "$GITHUB_ENV"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag's section of CHANGELOG.md as the notes (GitHub's own list of changes when there is none)
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "WineLib $GITHUB_REF_NAME" "${notes[@]}"

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
