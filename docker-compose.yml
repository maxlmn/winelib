# WineLib with Docker: docker compose up -d, then http://localhost:8000 (the first start opens on a short setup page).
services:
  winelib:
    image: ghcr.io/maxlmn/winelib:latest
    build: .  # docker compose up -d --build: from this checkout instead
    container_name: winelib
    restart: unless-stopped
    # This computer only. To reach it from elsewhere, put your own sign-in in front (Tailscale, a proxy with
    # login): never expose it bare
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - winelib-data:/data  # the database, photos, map outlines, backups, plug-ins
    # Optional keys (Settings › Integrations says what each needs; .secrets.env.example lists them all), here or
    # in a .secrets.env file in the data volume:
    # environment:
    #   - WINELIB_HOSTS=wine.example.com   # reached through a domain of your own: the name it answers to
    #   - ANTHROPIC_API_KEY=...   # Fill from photos
    #   - ESRI_API_KEY=...        # the satellite view outside France
    #   - WINELABS_API_KEY=...    # market prices
    #   - BI_EMAIL=...            # Bordeaux Index
    #   - BI_PASSWORD=...

volumes:
  winelib-data:
